# Проверки при каждом изменении: движок, боты, сетевой протокол (на демо-сети) и схема базы на PostgreSQL.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Схема Supabase и правила доступа (RLS)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: sh supabase/tests/run.sh
