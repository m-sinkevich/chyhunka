   # Раз в 3 дня обращается к Supabase, чтобы бесплатный проект не уходил в паузу.
   name: Supabase keep-alive
   on:
     schedule:
       - cron: '17 6 */3 * *'
     workflow_dispatch:
   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - name: Ping Supabase
           env:
             URL: ${{ secrets.SUPABASE_URL }}
             KEY: ${{ secrets.SUPABASE_ANON_KEY }}
           run: |
             if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Секреты SUPABASE_URL / SUPABASE_ANON_KEY не заданы"; exit 1; fi
             URL="${URL%%/rest/v1*}"; URL="${URL%/}"
             curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
